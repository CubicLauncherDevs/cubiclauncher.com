<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
	<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin="anonymous" />
	<link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
	<script>
		// Set the locale before first paint so the correct font loads immediately.
		try {
			const supportedLocales = ["es", "en", "fr", "de", "ru", "uk", "ja"];
			const stored = localStorage.getItem("locale");
			const candidates = navigator.languages?.length ? navigator.languages : [navigator.language];
			const detected = candidates
				.map((lang) => (lang || "").split("-")[0].toLowerCase())
				.find((lang) => supportedLocales.includes(lang));
			const locale = stored && supportedLocales.includes(stored) ? stored : detected;
			if (locale) document.documentElement.lang = locale;
		} catch {
			// Ignore storage/navigator access errors.
		}

		(function () {
			var stored = null;
			try {
				stored = localStorage.getItem("theme-mode");
			} catch (e) {
				// ignore
			}
			var mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
			var resolved = mode === "system" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
			document.documentElement.classList.add(resolved);
			document.documentElement.style.colorScheme = resolved;
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
